<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0555fd">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>ARCHiVE — obnova zálohy</title>
<style>
:root {
  color-scheme: dark;
  --bg: #12161f; --text: #e8ebf2; --muted: #9aa4b5; --faint: #6b7590;
  --card: #1a2030; --border: #2a3348; --input-bg: #12161f;
  --accent: #4f8cff; --accent-hover: #3d76e0; --accent-soft: rgba(79,140,255,.12);
  --bar: #2a3348; --ok: #4cc38a; --error: #ff6b6b;
  --shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 28px rgba(0,0,0,.22);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f4f8; --text: #1c2330; --muted: #5a6475; --faint: #8a93a5;
  --card: #ffffff; --border: #d7dde8; --input-bg: #ffffff;
  --accent: #2f6fe0; --accent-hover: #255cc0; --accent-soft: rgba(47,111,224,.10);
  --bar: #d7dde8; --ok: #148f57; --error: #d94848;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 28px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;
    --bg: #f2f4f8; --text: #1c2330; --muted: #5a6475; --faint: #8a93a5;
    --card: #ffffff; --border: #d7dde8; --input-bg: #ffffff;
    --accent: #2f6fe0; --accent-hover: #255cc0; --accent-soft: rgba(47,111,224,.10);
    --bar: #d7dde8; --ok: #148f57; --error: #d94848;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 28px rgba(16,24,40,.08);
  }
}
* { box-sizing: border-box; }
body {
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  margin: 0; padding: 2rem 1rem; line-height: 1.45;
  transition: background .25s ease, color .25s ease;
}
main { max-width: 42rem; margin: 0 auto; }
.head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
.brand { display: flex; align-items: center; gap: .6rem; }
.brandmark {
  width: 2.4rem; height: 2.4rem; border-radius: 10px; flex-shrink: 0; overflow: hidden;
  box-shadow: var(--shadow);
}
.brandmark img { width: 100%; height: 100%; display: block; }
h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
h1 span { color: var(--accent); }
h1 small { display: block; font-size: .85rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
p.lead { color: var(--muted); margin: .9rem 0 0; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 1.35rem; margin: 1.1rem 0; box-shadow: var(--shadow);
  transition: background .25s ease, border-color .25s ease;
}
h2 { font-size: 1.05rem; margin: 0 0 .9rem; letter-spacing: -.01em; }
label { display: flex; align-items: center; gap: .4rem; font-size: .85rem; color: var(--muted); margin: .9rem 0 .35rem; }
label small { font-weight: 400; }
label .ic { width: .95rem; height: .95rem; }
input {
  width: 100%; padding: .65rem .8rem; border-radius: 9px;
  border: 1px solid var(--border); background: var(--input-bg); color: var(--text);
  font-size: 1rem; transition: border-color .15s ease, box-shadow .15s ease;
}
input::placeholder { color: var(--faint); }
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
button {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  background: var(--accent); color: #fff; border: 0; border-radius: 9px;
  padding: .68rem 1.2rem; font-size: .98rem; font-weight: 600; cursor: pointer;
  transition: background .15s ease, transform .05s ease;
}
button:hover { background: var(--accent-hover); }
button:active { transform: translateY(1px); }
button:disabled { background: var(--border); color: var(--faint); cursor: wait; }
button.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); font-weight: 500; }
button.ghost:hover { color: var(--text); border-color: var(--faint); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#themeBtn { padding: .5rem; border-radius: 9px; }
.ic { width: 1.05rem; height: 1.05rem; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.actions { display: flex; gap: .6rem; margin-top: 1.1rem; flex-wrap: wrap; }
.divider { border: 0; border-top: 1px solid var(--border); margin: 1.1rem 0; }
#device, .device { display: flex; align-items: center; gap: .45rem; color: var(--muted); margin-bottom: .8rem; font-size: .92rem; }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th, td { text-align: left; padding: .5rem .5rem; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 500; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
tr:last-child td { border-bottom: 0; }
td .ic { width: .95rem; height: .95rem; vertical-align: -2px; }
.ok { color: var(--ok); } .no { color: var(--faint); }
td.ok, td.no { display: flex; align-items: center; gap: .35rem; }
#status { min-height: 1.4rem; color: var(--muted); font-size: .92rem; }
.alert {
  display: flex; align-items: flex-start; gap: .5rem;
  border: 1px solid var(--border); border-left: 3px solid var(--error);
  border-radius: 9px; padding: .6rem .75rem; margin-top: .8rem;
  color: var(--error); font-size: .92rem; white-space: pre-wrap;
}
.alert .ic { margin-top: .1rem; }
.spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid var(--bar); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: .5rem; }
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display: none; }
.steps { display: flex; align-items: center; gap: .5rem; color: var(--muted); font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 .9rem; }
.steps b { color: var(--accent); }
.bar { height: 10px; background: var(--bar); border-radius: 999px; overflow: hidden; }
.bar .fill {
  height: 100%; width: 2%; border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), #7aa9ff);
  transition: width .6s ease; animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
.plabel { display: flex; align-items: baseline; gap: .5rem; margin: .8rem 0 .1rem; }
.plabel .pct { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
.plabel .cur { color: var(--muted); font-weight: 600; }
.pdetail { display: flex; align-items: center; gap: .45rem; color: var(--faint); font-size: .85rem; min-height: 1.2rem; margin-top: .15rem; }
.result-head { display: flex; align-items: center; gap: .55rem; margin: 0 0 .8rem; }
.result-head .badge { width: 2rem; height: 2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.result-head.ok .badge { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.result-head.fail .badge { background: color-mix(in srgb, var(--error) 15%, transparent); color: var(--error); }
.result-head h2 { margin: 0; }
.outpath { display: flex; align-items: flex-start; gap: .45rem; color: var(--muted); font-size: .9rem; margin: .9rem 0 0; }
.outpath code { word-break: break-all; }
footer { color: var(--faint); font-size: .8rem; margin-top: 2rem; text-align: center; }
@media (max-width: 560px) {
  body { padding: 1.25rem .9rem; }
  .card { padding: 1.05rem; }
  .actions button { flex: 1 1 auto; }
  .plabel .pct { font-size: 1.3rem; }
}
</style>
<script>try { const t = localStorage.getItem("archive-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-archive" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></symbol>

<main>
<div class="head">
  <div class="brand">
    <div class="brandmark"><img src="/apple-touch-icon.png" alt=""></div>
    <h1><span>ARCHiVE</span><small>Obnova zálohy iPhonu</small></h1>
  </div>
  <button id="themeBtn" class="ghost" title="Motiv"><svg class="ic"><use href="#i-monitor"/></svg></button>
</div>
<p class="lead">Vyber složku se zálohou, nech ji zkontrolovat a jedním klikem obnov všechna data. Vše běží jen na tomto počítači.</p>

<div class="card" id="step1">
  <label for="backup"><svg class="ic"><use href="#i-folder"/></svg>Složka se zálohou</label>
  <input id="backup" placeholder="např. ~/Backup/00008101-…" spellcheck="false" value="__BACKUP_PATH__">
  <label for="password"><svg class="ic"><use href="#i-lock"/></svg>Heslo zálohy <small>(jen u šifrované; jinak nech prázdné)</small></label>
  <input id="password" type="password" placeholder="Nepovinné">
  <div class="actions">
    <button id="inspectBtn"><svg class="ic"><use href="#i-search"/></svg>Analyzovat zálohu</button>
  </div>
  <div id="status"></div>
</div>

<div class="card hidden" id="step2">
  <h2>Co v záloze je</h2>
  <div id="device"><svg class="ic"><use href="#i-phone"/></svg><span></span></div>
  <table id="stores">
    <thead><tr><th>Data</th><th>Stav</th><th>Položek</th></tr></thead>
    <tbody></tbody>
  </table>
  <hr class="divider">
  <label for="out"><svg class="ic"><use href="#i-folder"/></svg>Kam uložit výsledek <small>(volitelné — nech prázdné pro složku vedle zálohy)</small></label>
  <input id="out" placeholder="např. ~/Desktop/Obnova" spellcheck="false">
  <div class="actions">
    <button id="recoverBtn"><svg class="ic"><use href="#i-download"/></svg>Obnovit všechna data</button>
    <button id="quitBtn" class="ghost"><svg class="ic"><use href="#i-power"/></svg>Konec</button>
  </div>
</div>

<div class="card hidden" id="step3">
  <h2>Průběh obnovy</h2>
  <div id="progress">
    <div class="bar"><div class="fill" id="barfill"></div></div>
    <div class="plabel"><span class="pct" id="pctNum">0 %</span><span class="cur" id="progressLabel"><span class="spinner"></span>Startuji obnovu…</span></div>
    <div class="pdetail" id="progressDetail"></div>
  </div>
  <div id="result" class="hidden"></div>
</div>

<footer>ARCHiVE — lokální nástroj. Heslo ani data nikam neodesílá.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const TOKEN = "__CSRF_TOKEN__";
const ic = name => '<svg class="ic"><use href="#i-' + name + '"/></svg>';
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
window.onerror = (m, src, line) => {
  const st = document.getElementById("status");
  if (st) st.innerHTML = '<div class="alert">' + ic("alert") + '<span>Chyba stránky: ' + esc(m) + '</span></div>';
};

async function api(path, opts) {
  const r = await fetch(path, {...(opts || {}), headers: {"X-Archive-Token": TOKEN, ...(opts || {}).headers}});
  return r.json();
}

const LABEL = {contacts:"Kontakty", calls:"Hovory", accounts:"Účty", "known-networks":"Wi-Fi sítě",
  voicemail:"Hlasové zprávy", "voice-memos":"Diktafon",
  "safari-history":"Safari historie", "safari-bookmarks":"Safari záložky", calendar:"Kalendář", notes:"Poznámky",
  photos:"Fotky a videa", "photos-recently-deleted":"Smazané fotky", attachments:"Přílohy zpráv",
  whatsapp:"WhatsApp", health:"Zdraví", reminders:"Připomínky", mail:"Pošta", "homescreen-layout":"Plocha",
  "data-usage":"Datový provoz", "device-usage":"Využití aplikací", interactions:"Historie kontaktů",
  "bluetooth-devices":"Bluetooth", "significant-locations":"Historie polohy", "keyboard-lexicon":"Klávesnice"};

$("inspectBtn").onclick = async () => {
  try {
    const backup = $("backup").value.trim();
    if (!backup) { $("status").innerHTML = '<div class="alert">' + ic("alert") + '<span>Zadej cestu ke složce se zálohou.</span></div>'; return; }
    $("inspectBtn").disabled = true;
    $("status").innerHTML = '<span class="spinner"></span>Kontroluji zálohu…';
    let v;
    try {
      v = await api("/api/inspect?backup=" + encodeURIComponent(backup) + "&password=" + encodeURIComponent($("password").value));
    } catch (e) {
      $("inspectBtn").disabled = false;
      $("status").innerHTML = '<div class="alert">' + ic("alert") + '<span>Síťová chyba: ' + esc(e.message || e) + '</span></div>';
      return;
    }
    $("inspectBtn").disabled = false;
    if (v.ok === false) {
      $("status").innerHTML = '<div class="alert">' + ic("alert") + '<span>' + esc(v.error) + '</span></div>';
      return;
    }
    $("status").textContent = "";
    const d = v.device || {};
    $("device").querySelector("span").textContent = [d.name, d.model, d.ios ? "iOS " + d.ios : ""].filter(Boolean).join(" · ");
    $("stores").querySelector("tbody").innerHTML = (v.stores || []).map(s => {
      const present = s.present && s.supported;
      const count = (s.present && s.count != null) ? s.count.toLocaleString("cs") : "—";
      const state = present
        ? '<span class="ok">' + ic("check") + " nalezeno</span>"
        : (s.present ? '<span class="no">nepodporováno</span>' : '<span class="no">není v záloze</span>');
      return "<tr><td>" + esc(LABEL[s.type] || s.type) + "</td><td>" + state + "</td><td>" + count + "</td></tr>";
    }).join("");
    $("step2").classList.remove("hidden");
    $("step2").scrollIntoView({behavior: "smooth"});
  } catch (e) {
    $("inspectBtn").disabled = false;
    $("status").innerHTML = '<div class="alert">' + ic("alert") + '<span>Chyba: ' + esc(e.message || e) + '</span></div>';
  }
};

$("recoverBtn").onclick = async () => {
  $("recoverBtn").disabled = true;
  $("step3").classList.remove("hidden");
  $("progress").classList.remove("hidden");
  $("result").classList.add("hidden");
  $("barfill").style.width = "2%";
  $("pctNum").textContent = "0 %";
  $("progressLabel").innerHTML = '<span class="spinner"></span>Startuji obnovu…';
  $("progressDetail").textContent = "";
  recoverStarted = Date.now();
  lastPct = -1; lastEta = NaN;
  $("step3").scrollIntoView({behavior: "smooth"});
  let started;
  try {
    started = await api("/api/recover", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({backup: $("backup").value.trim(), password: $("password").value, out: $("out").value.trim()})
    });
  } catch (e) {
    $("progressDetail").innerHTML = '<div class="alert">' + ic("alert") + '<span>Síťová chyba: ' + esc(e.message || e) + '</span></div>';
    $("recoverBtn").disabled = false;
    return;
  }
  if (started.ok === false) {
    $("progressLabel").innerHTML = "Nezdařilo se";
    $("progressDetail").innerHTML = '<div class="alert">' + ic("alert") + '<span>' + esc(started.error) + '</span></div>';
    $("recoverBtn").disabled = false;
    return;
  }
  poll();
};

let pollTimer;
let recoverStarted = 0;
let lastPct = -1, lastEta = NaN;
function fmtEta(sec) {
  if (!isFinite(sec) || sec <= 0) return "";
  if (sec < 90) return "~" + Math.round(sec) + " s";
  const min = Math.round(sec / 60);
  if (min < 90) return "~" + min + " min";
  return "~" + (min / 60).toFixed(1).replace(".", ",") + " h";
}
function poll() {
  pollTimer = setTimeout(async () => {
    let v;
    try { v = await api("/api/status"); } catch (e) { poll(); return; }
    if (v.running) {
      const p = v.progress;
      if (p && p.total > 0) {
        const pct = Math.min(100, Math.round(p.percent || 0));
        $("barfill").style.width = Math.max(pct, 2) + "%";
        $("pctNum").textContent = pct + " %";
        $("progressLabel").innerHTML = "<b>" + esc(p.current) + "</b>";
        const elapsed = (Date.now() - recoverStarted) / 1000;
        // Only recompute the ETA when the bar actually moved; a frozen percent
        // (long per-file phase between polls) would otherwise extrapolate a
        // runaway "zbývá 2 h" from a constant pct.
        if (pct !== lastPct) { lastPct = pct; lastEta = pct > 1 ? elapsed * (100 - pct) / pct : NaN; }
        const eta = lastEta;
        const bits = ["sekce " + p.done + "/" + p.total];
        if (p.detail) bits.push(p.detail);
        bits.push("zbývá " + (fmtEta(eta) || "…"));
        $("progressDetail").innerHTML = bits.map(esc).join(" · ");
      }
      poll();
      return;
    }
    $("progress").classList.add("hidden");
    const r = v.result;
    const box = $("result");
    box.classList.remove("hidden");
    if (r && r.ok) {
      $("barfill").style.width = "100%";
      $("barfill").style.animation = "none";
      const sections = (r.sections || []).map(s => "<tr><td>" + esc(LABEL[s.type] || s.label || s.type) + "</td><td>" + (s.count || 0).toLocaleString("cs") + "</td></tr>").join("");
      const d = r.device || {};
      box.innerHTML = '<div class="result-head ok"><div class="badge">' + ic("check") + '</div><h2>Hotovo</h2></div>'
        + '<div class="device"><svg class="ic"><use href="#i-phone"/></svg><span>' + esc([d.name, d.model, d.ios ? "iOS " + d.ios : ""].filter(Boolean).join(" · ")) + '</span></div>'
        + "<table><thead><tr><th>Kategorie</th><th>Položek</th></tr></thead><tbody>" + sections + "</tbody></table>"
        + '<div class="outpath">' + ic("folder") + '<code class="path">' + esc(v.index_html || (r.outputs || [""])[0] || "") + '</code></div>'
        + '<div class="actions"><button id="openBtn">' + ic("open") + 'Otevřít výsledky</button>'
        + '<button id="againBtn" class="ghost">' + ic("refresh") + 'Obnovit další zálohu</button></div>';
      $("openBtn").onclick = () => api("/api/open", {method: "POST"});
      $("againBtn").onclick = () => location.reload();
    } else {
      box.innerHTML = '<div class="result-head fail"><div class="badge">' + ic("alert") + '</div><h2>Obnova se nepovedla</h2></div>'
        + '<div class="alert">' + ic("alert") + '<span>' + esc((r && r.error) || "neznámá chyba") + '</span></div>'
        + '<p style="color:var(--muted)">Zkontroluj cestu a heslo, případně zkus obnovu znovu.</p>'
        + '<div class="actions"><button onclick="location.reload()">' + ic("refresh") + 'Zkusit znovu</button></div>';
    }
    $("recoverBtn").disabled = false;
  }, 1500);
}

$("quitBtn").onclick = () => api("/api/quit", {method: "POST"});

// --- Theme: default follows the system; the button cycles system → light → dark
// and the explicit choice persists in localStorage.
function resolvedTheme() {
  const t = document.documentElement.dataset.theme;
  if (t === "light" || t === "dark") return t;
  return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
}
function applyThemeIcon() {
  const t = resolvedTheme();
  const name = t === "dark" ? "moon" : "sun";
  $("themeBtn").innerHTML = '<svg class="ic"><use href="#i-' + name + '"/></svg>';
  $("themeBtn").title = "Motiv: " + (t === "dark" ? "tmavý" : "světlý") + " — klik přepne, výchozí je nastavení systému";
}
$("themeBtn").onclick = () => {
  const order = [null, "light", "dark"];
  const cur = localStorage.getItem("archive-theme");
  const next = order[(order.indexOf(cur) + 1) % order.length];
  if (next === null) {
    localStorage.removeItem("archive-theme");
    delete document.documentElement.dataset.theme;
  } else {
    localStorage.setItem("archive-theme", next);
    document.documentElement.dataset.theme = next;
  }
  applyThemeIcon();
};
applyThemeIcon();
</script>
